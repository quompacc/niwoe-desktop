[package]
name = "niwoe-login"
version.workspace = true
edition = "2021"

[dependencies]
drm = "0.15"
evdev = "0.13"
libc = "0.2"
niwoe-boot-common = { path = "../niwoe-boot-common" }
niwoe-compass-render = { path = "../niwoe-compass-render" }
niwoe-config = { path = "../niwoe-config" }
niwoe-tokens = { path = "../niwoe-tokens" }
nix = { version = "0.29", features = ["user", "fs"] }
tiny-skia = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
xkbcommon = "0.8"
zeroize = "1"

[target.'cfg(not(target_os = "openbsd"))'.dependencies]
pam-sys = "1.0.0-alpha5"

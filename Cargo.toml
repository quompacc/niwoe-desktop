[workspace]
# The root package is already a member. Listing "." here would also pull
# excluded path dependencies below the root back into the workspace.
members = [
    "crates/niwoe-compositor",
    "crates/niwoe-wm",
    "crates/niwoe-shell",
    "crates/niwoe-ipc",
    "crates/niwoe-config",
    "crates/niwoe-tokens",
    "crates/niwoe-portal",
    "crates/niwoe-ui",
    "crates/niwoe-freetype",
    "crates/niwoe-login",
    "crates/niwoe-lock",
    "crates/niwoe-polkit",
    "crates/niwoe-compass-render",
    "crates/niwoe-boot-common",
    "crates/niwoe-app-catalog",
    "crates/niwoe-xwayland-drm-bridge",
]
exclude = ["third_party/smithay"]

[workspace.package]
version = "0.5.1"

[workspace.dependencies]
bitflags = "2"
# OpenBSD needs a small target-native Smithay port layer. The vendored source is
# exactly upstream 060e9cd9 plus the documented changes in
# third_party/smithay/OPENBSD_PORT.md.
smithay = { path = "third_party/smithay", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_winit",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "xwayland",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
taffy = "0.7"
tiny-skia = "0.11"
ab_glyph = "0.2"

[package]
name = "niwoe"
version.workspace = true
edition = "2021"

[dependencies]
libc = "0.2"
niwoe-compositor = { path = "crates/niwoe-compositor" }
smithay = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
